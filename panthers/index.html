<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sideline | Panthers</title>

  <meta name="apple-mobile-web-app-title" content="Panthers">
  <script>
    (() => {
      const param = new URLSearchParams(window.location.search).get("scoutTheme");
      const theme =
        param || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>

    html[data-theme="dark"] {

      --cp-bg-elevated: #343231;
      --cp-surface: #292929;
      --cp-surface-soft: #2e2e2e;
      --cp-border: #474747;
      --cp-border-strong: #5f5f5f;
      --cp-text: #dedede;
      --cp-text-muted: #919191;
      --cp-text-soft: #b0b0b0;
      --cp-accent: #fd8ea1;
      --cp-accent-hover: #fb7b91;

    * { box-sizing: border-box; }

    .shell { max-width: 1600px; margin: auto; padding: 0 12px 40px; }
    .topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px; min-height: 60px; margin: 0 -12px 10px; padding: 5px max(12px, env(safe-area-inset-right)) 5px max(12px, env(safe-area-inset-left)); background: var(--cp-surface); border-bottom: 1px solid var(--cp-border); }
    .brand { flex: 0 0 44px; width: 44px; height: 44px; padding: 2px; cursor: pointer; }
    .team-logo-tile { display: grid; place-items: center; flex: 0 0 auto; width: 54px; height: 54px; padding: 3px; overflow: hidden; border: 1px solid var(--cp-border); border-radius: .625rem; background: var(--cp-bg-elevated); }
    body[data-team="golden-warriors"] .team-logo-tile { background: var(--cp-text); }

    .team-identity { min-width: 0; }

    .team-identity strong { display: block; font-size: .9rem; white-space: nowrap; }
    @media (max-width: 1120px) { .team-identity { display: none; } }
    .nav { display: flex; align-items: center; flex: 1; min-width: 0; gap: 2px; overflow-x: auto; scrollbar-width: none; }
    .nav::-webkit-scrollbar { display: none; }
    .nav button { white-space: nowrap; min-height: 40px; border: 0; border-radius: 10px; background: transparent; color: var(--cp-text-muted); padding: 7px 11px; font-size: .84rem; font-weight: 650; }
    .nav button.active { background: var(--cp-accent-soft); color: var(--cp-accent); }

    h2 { margin: 0; font-size: 1.1rem; letter-spacing: -.02em; }

    .home-hero { padding: 20px; }
    .home-heading { display: flex; align-items: center; gap: 16px; }

    .home-hero .card-head { margin-bottom: 4px; }
    .home-hero .actions { margin-top: 18px; }
    .overview { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 16px 0; }
    .overview div { padding: 12px 8px; border: 1px solid var(--cp-border); border-radius: .625rem; background: var(--cp-bg-elevated); }
    .overview strong, .overview small { display: block; }
    .overview strong { font-size: 1.25rem; }

    .name { font-weight: 680; }

    .pill { display: inline-flex; align-items: center; white-space: nowrap; padding: 5px 9px; border: 1px solid var(--cp-border); border-radius: 99px; background: var(--cp-bg-elevated); font-size: .74rem; font-weight: 650; }
    .pill.rose { background: var(--cp-accent-soft); color: var(--cp-accent); border-color: var(--cp-highlight); }
    .pill.warning { color: var(--cp-warning); }
    .primary, .secondary, .quiet, .choice { min-height: 42px; border-radius: 10px; padding: 9px 14px; font-weight: 700; }
    .primary { background: var(--cp-accent); color: var(--cp-accent-fg); border: 1px solid var(--cp-accent); }
    .primary:hover:not(:disabled) { background: var(--cp-accent-hover); }
    .secondary { background: var(--cp-surface); color: var(--cp-text); border: 1px solid var(--cp-border-strong); }

    .actions { justify-content: flex-start; flex-wrap: wrap; margin-top: 12px; }

    .queue { gap: 4px; }
    .queue-label { font-size: .71rem; color: var(--cp-text-muted); letter-spacing: .06em; text-transform: uppercase; font-weight: 750; margin: 2px 0; }
    .queue-label.bottom { text-align: right; color: var(--cp-accent); }

    .queue-item.selected, .queue-item.due { border-color: var(--cp-accent); background: var(--cp-accent-soft); }

    .position-code { flex: 0 0 auto; min-width: 38px; padding: 4px 5px; border: 1px solid var(--cp-highlight); border-radius: 6px; background: var(--cp-accent-soft); color: var(--cp-accent); font-size: .88rem; font-weight: 850; text-align: center; }
    .queue-item .quiet { min-height: 34px; font-size: .76rem; }
    .queue-pick { width: 100%; padding: 0; text-align: left; border: 0; background: transparent; color: var(--cp-text); }
    .queue-pick:disabled { opacity: 1; }
    .pitch { position: relative; width: 100%; height: clamp(380px, 74dvh, 780px); overflow: hidden; border: 2px solid var(--cp-border-strong); border-radius: 10px; background: repeating-linear-gradient(0deg, var(--cp-surface-soft), var(--cp-surface-soft) 52px, var(--cp-bg-elevated) 52px, var(--cp-bg-elevated) 104px); }
    .game-layout .pitch { height: clamp(400px, calc(100dvh - 168px), 730px); }
    .pitch::before { content: ""; position: absolute; inset: 10px; border: 2px solid var(--cp-border-strong); border-radius: 3px; pointer-events: none; }
    .pitch::after { content: ""; position: absolute; bottom: 10px; left: 30%; width: 40%; height: 22%; border: 2px solid var(--cp-border-strong); border-bottom: 0; pointer-events: none; }
    .midline { position: absolute; left: 10px; right: 10px; top: 13%; border-top: 2px solid var(--cp-border-strong); }
    .center-circle { position: absolute; top: 13%; left: 50%; width: 76px; height: 76px; transform: translate(-50%, -50%); border: 2px solid var(--cp-border-strong); border-radius: 50%; }
    .goal { position: absolute; bottom: 0; left: 41%; right: 41%; height: 9px; background: var(--cp-border-strong); border-radius: 4px 4px 0 0; }
    .goal::before { content: ""; position: absolute; bottom: 60px; left: 50%; width: 7px; height: 7px; border-radius: 50%; background: var(--cp-border-strong); }
    .pitch-note { position: absolute; top: 17px; left: 19px; color: var(--cp-text-muted); font-size: .66rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 800; }
    .marker { position: absolute; z-index: 1; transform: translate(-50%, -50%); min-width: 82px; max-width: 104px; min-height: 52px; padding: 5px 7px; border: 1px solid var(--cp-accent); border-radius: 10px; background: var(--cp-surface); color: var(--cp-text); text-align: center; box-shadow: 0 1px 2px var(--cp-border); }
    .marker b { display: block; color: var(--cp-accent); font-size: 1rem; line-height: 1.08; letter-spacing: .04em; font-weight: 850; }
    .marker span { display: block; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-size: .69rem; font-weight: 600; }
    .marker.open { border-style: dashed; }
    .marker.offered { border-width: 2px; background: var(--cp-accent-soft); box-shadow: 0 0 0 2px var(--cp-highlight); }
    .marker.selected { background: var(--cp-accent); color: var(--cp-accent-fg); }
    .marker.selected b { color: var(--cp-accent-fg); }
    .marker.unavailable { opacity: .55; }
    .pitch-mini { color: var(--cp-text-muted); font-size: .77rem; margin-top: 7px; }
    .game-layout .field-card { padding: 10px; }
    .game-layout .field-card .card-head { margin: 0 4px 8px; }
    .live-rail, .draft-rail { height: clamp(500px, calc(100dvh - 80px), 815px); min-height: 0; }
    .live-rail { display: flex; flex-direction: column; gap: 10px; }
    .queue-panes { display: grid; grid-template-columns: minmax(0, 1.07fr) minmax(0, 1fr); gap: 8px; flex: 1; min-height: 0; }
    .queue-panes .card { overflow-y: auto; overscroll-behavior: contain; padding: 10px; scrollbar-width: thin; }
    .queue-panes .card-head { position: sticky; top: -10px; z-index: 2; background: var(--cp-surface); padding: 2px 0 8px; margin-bottom: 0; }
    .queue-panes .card-head .subtext { display: none; }
    .queue-panes .card-head h2 { font-size: .97rem; }
    .queue-panes .card-head .pill { padding: 3px 6px; font-size: .68rem; }
    .queue-panes .queue-item .name { font-size: .82rem; }
    .queue-panes .queue-item { padding-block: 0; }
    .queue-panes .queue-pick, .queue-panes .queue-item .quiet { min-height: 44px; }
    .queue-panes .queue-item .quiet { padding-inline: 2px; }
    .draft-rail { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .draft-scroll { display: grid; align-content: start; gap: 8px; flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding-right: 4px; scrollbar-width: thin; }
    .draft-scroll .card { padding: 12px; }
    .planned-scroll { display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
    .planned-scroll .card { padding: 10px; }
    .planned-scroll .card-head { margin-bottom: 4px; }
    .planned-scroll > .card:first-child { flex: 0 0 auto; }

    .bench-detail { max-height: 120px; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; }
    .choice-grid.direct-options { grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 4px; }
    .direct-options .choice { min-height: 48px; padding: 5px 4px; text-align: center; }

    .direct-options .choice small { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .draft-footer { display: flex; align-items: center; gap: 6px; flex: 0 0 auto; padding: 8px; background: var(--cp-surface); border: 1px solid var(--cp-border); border-radius: 10px; }

    .sub-row { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .sub-row .queue-pick { min-height: 42px; padding: 2px 8px; border: 1px solid var(--cp-border); border-radius: 10px; background: var(--cp-bg-elevated); }
    .sub-row .queue-pick.active, .exit-row.active { border-color: var(--cp-accent); background: var(--cp-accent-soft); }
    .sub-row .queue-pick b, .sub-row .queue-pick small, .exit-row b, .exit-row small { display: block; }

    .choice { min-height: 54px; text-align: left; border: 1px solid var(--cp-border); background: var(--cp-bg-elevated); color: var(--cp-text); }
    .choice.active { background: var(--cp-accent-soft); border-color: var(--cp-accent); color: var(--cp-accent); }

      .nav button { min-height: 44px; padding-inline: 6px; font-size: .76rem; }

</head>
<body data-team="panthers">
  <div id="unlock" class="shell" hidden>
    <section class="card unlock-wrap"><div class="unlock-brand">
      <span class="team-logo-tile"><img src="logo.png" alt="" width="54" height="54"></span>
      <div><span class="eyebrow">Sideline / Team access</span><h1>Panthers</h1></div>
    </div>
      <p>Enter this team's password to unlock its roster on this device.</p>
      <form id="unlock-form"><label for="password">Team password</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button class="primary" type="submit">Unlock team</button></form>
      <p id="unlock-status" class="unlock-error" role="alert"></p>
      <a href="../">Coach home</a>
    </section>
  </div>
  <div id="app-shell" class="shell" hidden>
    <header class="topbar"><button class="brand team-logo-tile" data-screen="home" aria-label="Team home"><img src="logo.png" alt="" width="44" height="44"></button>
      <div class="team-identity"><span>Sideline</span><strong>Panthers</strong></div>
      <nav class="nav" id="nav" aria-label="App screens"></nav><div id="top-action"></div></header>
    <main id="app"></main>
  </div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script>
    const teamInfo = { slug: "panthers", name: "Panthers" };
    let initialPositions = [];
    let positions = [];
    let initialPlayers = [];
    let fieldPositions = [];
    const screens = [["home", "Home"], ["game", "Game"], ["setup", "Setup"], ["history", "History"]];
    const state = {
      screen: "home", team: teamInfo.name, players: [], positionLayout: [],
      arrivalOrder: [], notReady: new Set(),
      assignments: Object.fromEntries(positions.map((pos) => [pos.code, null])),
      fieldQueue: [], benchQueue: [],
      gameStarted: false, draft: null, selected: null, round: 0, half: 1,
      events: [], undoStack: [], savedGames: []
    };
    const $ = (id) => document.getElementById(id);
    let database;
    let unlocked = false;
    let offlineError;
    function openDatabase() {
      return new Promise((resolve, reject) => {
        const request = indexedDB.open(`sideline-${teamInfo.slug}`, 1);
        request.onupgradeneeded = () => request.result.createObjectStore("values");
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }
    function readValue(key) {
      return new Promise((resolve, reject) => {
        const request = database.transaction("values").objectStore("values").get(key);
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }
    function writeValue(key, value) {
      return new Promise((resolve, reject) => {
        const transaction = database.transaction("values", "readwrite");
        transaction.objectStore("values").put(value, key);
        transaction.oncomplete = resolve;
        transaction.onerror = () => reject(transaction.error);
        transaction.onabort = () => reject(transaction.error);
      });
    }
    function saveGame() {
      if (!unlocked) return;
      writeValue("game", state).catch((error) =>
        notify(`Could not save this game on this device: ${error.message}`));
    }
    function decodeBase64(value) {
      return Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
    }
    async function decryptRoster(password) {
      const response = await fetch("roster.enc.json");
      if (!response.ok) throw new Error(`Roster download failed (${response.status}).`);
      const payload = await response.json();
      if (payload.version !== 1 || payload.kdf !== "PBKDF2-SHA-256" ||
          payload.iterations !== 210000) throw new Error("Unsupported roster format.");
      const base = await crypto.subtle.importKey(
        "raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
      const key = await crypto.subtle.deriveKey(
        { name: "PBKDF2", hash: "SHA-256", salt: decodeBase64(payload.salt),
          iterations: payload.iterations },
        base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      const plaintext = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: decodeBase64(payload.iv) }, key, decodeBase64(payload.data));
      const roster = JSON.parse(new TextDecoder().decode(plaintext));
      if (roster.name !== teamInfo.name || !Array.isArray(roster.players) ||
          !roster.players.every((name) => typeof name === "string" && name.trim()) ||
          !validPositions(roster.positions)) {
        throw new Error("Roster data is invalid.");
      }
      return roster;
    }
    function validPositions(layout) {
      return Array.isArray(layout) && layout.length > 1 && layout[0]?.code === "GK" &&
        layout.every((pos) => pos && /^[A-Z][A-Z0-9]*$/.test(pos.code) &&
          typeof pos.display === "string" && /^[A-Z][A-Z0-9]*$/.test(pos.display) &&
          typeof pos.label === "string" && pos.label.trim() &&
          Number.isFinite(pos.x) && pos.x >= 0 && pos.x <= 100 &&
          Number.isFinite(pos.y) && pos.y >= 0 && pos.y <= 100) &&
        new Set(layout.map((pos) => pos.code)).size === layout.length;
    }
    function previousLayout(assignments) {
      const old = [
        ["GK", "Goalkeeper", 50, 88], ["LB", "Left back", 15, 70],
        ["LCB", "Left center back", 38, 73], ["RCB", "Right center back", 62, 73],
        ["RB", "Right back", 85, 70], ["LM", "Left mid", 17, 49],
        ["CM", "Center mid", 50, 48], ["RM", "Right mid", 83, 49],
        ["LW", "Left wing", 19, 29], ["ST", "Striker", 50, 27],
        ["RW", "Right wing", 81, 29]
      ].map(([code, label, x, y]) => ({ code, display: code, label, x, y }));
      return Object.keys(assignments).join("|") === old.map((pos) => pos.code).join("|")
        ? old : null;
    }
    async function unlockTeam(password) {
      try {
        const roster = await decryptRoster(password);
        const saved = await readValue("game");
        if (saved && (!Array.isArray(saved.players) || !(saved.notReady instanceof Set) ||
            !Array.isArray(saved.savedGames) || !saved.assignments ||
            !Array.isArray(saved.arrivalOrder))) {
          throw new Error("Saved game data is invalid; it has not been overwritten.");
        }
        initialPlayers = roster.players;
        initialPositions = roster.positions;
        const active = Boolean(saved?.gameStarted || saved?.arrivalOrder.length || saved?.draft);
        positions = active ? saved.positionLayout || previousLayout(saved.assignments) || (
          Object.keys(saved.assignments).join("|") === initialPositions.map((pos) => pos.code).join("|")
            ? initialPositions : null) : initialPositions;
        if (!validPositions(positions) || active &&
            Object.keys(saved.assignments).join("|") !== positions.map((pos) => pos.code).join("|")) {
          throw new Error("Saved game uses an unsupported position layout; it has not been overwritten.");
        }
        fieldPositions = positions.filter((pos) => pos.code !== "GK");
        if (saved) {
          Object.assign(state, saved);
          state.positionLayout = positions;
          state.players = [...initialPlayers,
            ...state.players.filter((name) => !initialPlayers.includes(name))];
          if (!active) {
            state.players = [...initialPlayers];
            state.assignments = Object.fromEntries(positions.map((pos) => [pos.code, null]));
          }
        } else {
          state.players = [...initialPlayers];
          state.positionLayout = positions;
          state.assignments = Object.fromEntries(positions.map((pos) => [pos.code, null]));
        }
        state.team = teamInfo.name;
        await writeValue("password", password);
        unlocked = true;
        $("unlock").hidden = true;
        $("app-shell").hidden = false;
        render();
        if (offlineError) notify(offlineError);
      } catch (error) {
        $("unlock-status").textContent = error.name === "OperationError"
          ? "Password did not unlock this team." : error.message;
        $("unlock").hidden = false;
      }
    }
    async function boot() {
      $("unlock").hidden = false;
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch((error) => {
          const message = `Offline installation is unavailable: ${error.message}`;
          offlineError = message;
          if (unlocked) notify(message);
          else $("unlock-status").textContent = message;
        });
      }
      try {
        database = await openDatabase();
        const password = await readValue("password");
        if (password) await unlockTeam(password);
      } catch (error) {
        $("unlock-status").textContent = `Device storage is unavailable: ${error.message}`;
      }
    }
    const esc = (value) => String(value).replace(/[&<>"']/g, (char) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
    const avatar = (name) => `<span class="avatar">${esc(name.slice(0, 2).toUpperCase())}</span>`;
    const button = (text, action, kind = "secondary", extra = "") =>
      `<button class="${kind}" data-action="${action}" ${extra}>${text}</button>`;
    const cloneLineup = (lineup) => ({
      assignments: { ...lineup.assignments },
      fieldQueue: [...lineup.fieldQueue],
      benchQueue: [...lineup.benchQueue]
    });
    const posFor = (assignments, player) =>
      Object.keys(assignments).find((code) => assignments[code] === player) || "";
    const displayFor = (code) => positions.find((pos) => pos.code === code)?.display || code;
    const labelFor = (code) => positions.find((pos) => pos.code === code)?.label || code;
    const openFieldPositions = (assignments) =>
      fieldPositions.filter((pos) => !assignments[pos.code]).map((pos) => pos.code);
    const readyBench = (lineup) => lineup.benchQueue.filter((player) => !state.notReady.has(player));
    const originalBench = () => state.draft?.base.benchQueue || [];
    const chosenEntrants = () => {
      const seen = new Set();
      return state.draft?.operations.filter((op) => {
        if (!op.position ||
            !originalBench().includes(op.player) || seen.has(op.player)) return false;
        seen.add(op.player);
        return true;
      }) || [];
    };
    const pendingLineupWaiting = (lineup) => new Set([
      ...state.draft.base.fieldQueue, state.draft.base.assignments.GK,
      ...chosenEntrants().map((op) => op.player)
    ].filter((player) => player && lineup.benchQueue.includes(player)));
    function rememberChange() {
      state.undoStack.push({
        lineup: cloneLineup(state), players: [...state.players],
        arrivalOrder: [...state.arrivalOrder], notReady: new Set(state.notReady),
        round: state.round, half: state.half,
        gameStarted: state.gameStarted, events: [...state.events]
      });
    }
    function notify(message) {
      const el = $("toast"); el.textContent = message; el.classList.remove("hidden");
      clearTimeout(notify.timeout); notify.timeout = setTimeout(() => el.classList.add("hidden"), 3200);
    }
    function go(screen) {
      state.screen = screen; render(); window.scrollTo({ top: 0, behavior: "instant" });
    }
    function newGame() {
      if ((state.gameStarted || state.arrivalOrder.length || state.draft) &&
          !window.confirm(state.gameStarted
            ? "Start a new game? The current game will be saved, but unfinished choices will be discarded."
            : "Start a new game? Unconfirmed setup choices will be discarded.")) return;
      archiveGame();
      resetGame();
      go("setup");
    }
    function archiveGame() {
      if (!state.gameStarted && !state.events.length) return;
      state.savedGames.unshift({
        id: crypto.randomUUID(), savedAt: new Date().toISOString(),
        half: state.half, round: state.round, events: [...state.events],
        assignments: { ...state.assignments }, players: [...state.arrivalOrder],
        positions: [...positions]
      });
    }
    function resetGame() {
      positions = initialPositions;
      fieldPositions = positions.filter((pos) => pos.code !== "GK");
      state.positionLayout = positions;
      state.players = [...initialPlayers];
      state.arrivalOrder = []; state.notReady.clear();
      state.gameStarted = false; state.draft = null; state.selected = null;
      state.assignments = Object.fromEntries(positions.map((pos) => [pos.code, null]));
      state.fieldQueue = []; state.benchQueue = []; state.half = 1; state.round = 0;
      state.events = []; state.undoStack = [];
    }
    function startLineup() {
      if (state.gameStarted || state.draft) return;
      state.draft = {
        kind: "starting", base: cloneLineup(state), keeper: null, operations: [], skipped: new Set()
      };
      syncStartingDraft();
      state.selected = null;
      go("game");
    }
    function syncStartingDraft() {
      if (state.draft?.kind !== "starting") return;
      if (state.draft.keeper && !state.arrivalOrder.includes(state.draft.keeper)) {
        state.draft.keeper = null;
      }
      state.draft.base = cloneLineup(state);
      state.draft.operations = state.draft.operations.filter((op) =>
        state.arrivalOrder.includes(op.player) && op.player !== state.draft.keeper);
      for (const player of state.draft.skipped) {
        if (!state.arrivalOrder.includes(player)) state.draft.skipped.delete(player);
      }
      state.selected = null;
    }
    function syncDraftRoster(removed) {
      if (!state.draft) return;
      if (state.draft.kind === "starting") {
        const before = state.draft.operations.length;
        syncStartingDraft();
        if (state.draft.operations.length !== before) notify("A choice for the removed player was cleared.");
        removePendingChoice(-1);
        return;
      }
      if (state.draft.kind === "planned") {
        state.draft.base = cloneLineup(state);
        const cleared = reconcilePlanned({ excludedPlayer: removed });
        if (cleared) notify(`${cleared} pending choice${cleared === 1 ? "" : "s"} cleared after roster changed.`);
        return;
      }
      const priorAssignments = state.draft.base.assignments;
      state.draft.base = cloneLineup(state);
      if (state.draft.kind === "halftime" && !state.draft.base.assignments.GK) {
        state.draft.restOutgoingKeeper = false;
      }
      if (state.draft.fieldOrder) {
        state.draft.fieldOrder = state.draft.fieldOrder.filter((player) =>
          state.draft.base.fieldQueue.includes(player));
      }
      if (removed) {
        if (state.draft.kind === "halftime" && state.draft.keeper === removed) {
          state.draft.keeper = null;
          state.draft.restOutgoingKeeper = false;
          state.draft.operations = [];
          state.selected = null;
          notify("Goalkeeper candidate left; halftime choices were cleared.");
          return;
        }
        if (state.draft.keeper === removed) state.draft.keeper = null;
      }
      const pending = state.draft.operations;
      state.draft.operations = [];
      const lineup = preview();
      let cleared = 0;
      for (const op of pending) {
        const current = posFor(lineup.assignments, op.player);
        const playing = lineup.fieldQueue.includes(op.player) ||
          lineup.assignments.GK === op.player;
        const present = playing || lineup.benchQueue.includes(op.player);
        const valid = present && op.player !== removed &&
          (!removed || priorAssignments[op.position] !== removed) &&
          (op.type !== "bench" || playing) &&
          (op.expectedPosition === undefined || current === op.expectedPosition) &&
          (op.expectedOccupant === undefined ||
            lineup.assignments[op.position] === op.expectedOccupant) &&
          (op.wasField === undefined || Boolean(current) === op.wasField) &&
          (!op.position || positions.some((pos) => pos.code === op.position)) &&
          (op.position !== "GK" || op.type === "replacement" || !lineup.assignments.GK ||
            lineup.assignments.GK === op.player) &&
          (state.draft.kind !== "halftime" || !keeperNeedsChoice() ||
            op.player === state.draft.base.assignments.GK) &&
          (!["planned", "halftime"].includes(state.draft.kind) ||
            !state.draft.base.benchQueue.includes(op.player) || playing ||
            (chosenEntrants().length < groupSize() &&
              (!lineup.assignments[op.position] ||
                dueOut().includes(lineup.assignments[op.position]))));
        if (!valid) { cleared++; continue; }
        applyOperation(lineup, op);
        state.draft.operations.push(op);
      }
      if (cleared) notify(`${cleared} pending choice${cleared === 1 ? "" : "s"} cleared after roster changed.`);
      state.selected = state.draft.kind === "lineup" && state.selected &&
        state.arrivalOrder.includes(state.selected) ? state.selected : null;
      if (state.draft.kind === "lineup" && state.draft.targetPosition &&
          state.draft.base.assignments[state.draft.targetPosition]) {
        state.draft.targetPosition = null;
        state.draft.operations = [];
      }
      state.draft.outgoingEdit = null;
    }
    function beginDraft(kind) {
      if (state.draft) { notify("Save and Close or discard the current draft first."); return; }
      if (!state.gameStarted) { notify("Finish assigning the starting lineup first."); return; }
      if (kind === "planned" && !readyBench(state).length) {
        notify("Mark a bench player ready before planning a substitution."); return;
      }
      state.draft = { kind, base: cloneLineup(state), keeper: null, operations: [] };
      if (kind === "planned") {
        state.draft.fieldOrder = [...state.fieldQueue];
        state.draft.exitChanges = [];
      }
      if (kind === "halftime") state.draft.restOutgoingKeeper = false;
      state.selected = null;
      go("game");
    }
    function groupSize() {
      const ready = readyBench(state.draft.base).filter((player) =>
        player !== state.draft.keeper).length;
      if (state.draft.kind === "halftime") {
        const outgoingKeeper = state.draft.base.assignments.GK &&
          !state.draft.restOutgoingKeeper ? 1 : 0;
        const entrants = ready + outgoingKeeper;
        const group = entrants > fieldPositions.length / 2 ? Math.ceil(entrants / 2) : entrants;
        return Math.max(0, group - outgoingKeeper);
      }
      return ready > fieldPositions.length / 2 ? Math.ceil(ready / 2) : ready;
    }
    function eligibleBench() {
      if (!state.draft || state.draft.kind === "starting") return [];
      const ready = readyBench(state.draft.base).filter((player) =>
        state.draft.kind !== "halftime" || player !== state.draft.keeper);
      if (state.draft.kind === "lineup") {
        const waiting = pendingLineupWaiting(preview());
        return state.draft.base.benchQueue.filter((player) => !waiting.has(player));
      }
      if (state.draft.kind === "planned" || state.draft.kind === "halftime") return ready;
      return ready.slice(0, groupSize());
    }
    function nextBench(lineup) {
      if (["planned", "halftime"].includes(state.draft.kind) &&
          chosenEntrants().length >= groupSize()) return null;
      return eligibleBench().find((player) => lineup.benchQueue.includes(player)) || null;
    }
    function dueOut() {
      if (!state.draft || !["planned", "halftime"].includes(state.draft.kind)) return [];
      const keeperNeedsFieldSpot = state.draft.kind === "halftime" &&
        state.draft.base.assignments.GK &&
        !state.draft.restOutgoingKeeper &&
        state.draft.base.benchQueue.includes(state.draft.keeper);
      const vacancies = openFieldPositions(state.draft.base.assignments).length +
        (state.draft.kind === "halftime" &&
          (!state.draft.base.assignments.GK || state.draft.restOutgoingKeeper) &&
          state.draft.base.fieldQueue.includes(state.draft.keeper) ? 1 : 0);
      const count = Math.max(0, groupSize() + (keeperNeedsFieldSpot ? 1 : 0) - vacancies);
      if (!count) return [];
      return (state.draft.fieldOrder || state.draft.base.fieldQueue)
        .filter((player) => player !== state.draft.keeper)
        .slice(-count).reverse();
    }
    function planReconciliation({
      excludedPlayer = null, excludedOperation = -1, excludedExit = -1, waitingPlayer = null
    } = {}) {
      const draft = state.draft;
      const exits = draft.exitChanges.filter((_, index) => index !== excludedExit);
      const fieldOrder = [...draft.base.fieldQueue];
      const exitChanges = [];
      const canceled = [];
      const notReady = new Set(state.notReady);
      if (waitingPlayer) notReady.add(waitingPlayer);
      const ready = draft.base.benchQueue.filter((player) => !notReady.has(player)).length;
      const size = ready > fieldPositions.length / 2 ? Math.ceil(ready / 2) : ready;
      const exitCount = Math.max(0, size - openFieldPositions(draft.base.assignments).length);
      const offered = () => exitCount ? fieldOrder.slice(-exitCount).reverse() : [];
      for (const change of exits) {
        const current = offered();
        const from = fieldOrder.indexOf(change.outgoing);
        const to = fieldOrder.indexOf(change.replacement);
        if (from < 0 || to < 0 || !current.includes(change.outgoing) ||
            current.includes(change.replacement)) {
          canceled.push({ type: "exit", change }); continue;
        }
        [fieldOrder[from], fieldOrder[to]] = [fieldOrder[to], fieldOrder[from]];
        exitChanges.push(change);
      }
      const operations = [];
      const lineup = cloneLineup(draft.base);
      lineup.fieldQueue = [...fieldOrder];
      for (const [index, op] of draft.operations.entries()) {
        if (index === excludedOperation || op.player === excludedPlayer) continue;
        const current = posFor(lineup.assignments, op.player);
        const occupant = lineup.assignments[op.position];
        const entering = draft.base.benchQueue.includes(op.player) && !current &&
          op.type !== "bench";
        const chosen = new Set(operations.filter((choice) =>
          choice.position && draft.base.benchQueue.includes(choice.player))
          .map((choice) => choice.player));
        const valid = (current || lineup.benchQueue.includes(op.player)) &&
          (op.type !== "bench" || current) &&
          (op.type === "bench" || (positions.some((pos) => pos.code === op.position) &&
            (op.expectedOccupant === undefined || occupant === op.expectedOccupant) &&
            (op.wasField === undefined || Boolean(current) === op.wasField) &&
            (op.position !== "GK" || !occupant || occupant === op.player))) &&
          (!entering || (!notReady.has(op.player) &&
            chosen.size < size && (!occupant || offered().includes(occupant))));
        if (!valid) { canceled.push({ type: "operation", op }); continue; }
        applyOperation(lineup, op);
        operations.push(op);
      }
      return { fieldOrder, exitChanges, operations, canceled };
    }
    function reconcilePlanned(options = {}) {
      const draft = state.draft;
      const result = planReconciliation(options);
      draft.fieldOrder = result.fieldOrder;
      draft.exitChanges = result.exitChanges;
      draft.operations = result.operations;
      state.selected = null;
      draft.selectionPaused = false;
      draft.outgoingEdit = null;
      return result.canceled.length;
    }
    function removePendingChoice(index) {
      const draft = state.draft;
      const skipped = draft.kind === "starting" ? new Set(draft.skipped) : null;
      const pending = draft.operations.filter((_, i) => i !== index);
      draft.operations = [];
      const lineup = preview();
      let cleared = 0;
      for (const op of pending) {
        const current = posFor(lineup.assignments, op.player);
        const occupant = lineup.assignments[op.position];
        const present = current || lineup.fieldQueue.includes(op.player) ||
          lineup.benchQueue.includes(op.player);
        const entering = !current && draft.base.benchQueue.includes(op.player) &&
          op.type !== "bench";
        const valid = present && (op.type === "bench"
          ? current && (op.expectedPosition === undefined || current === op.expectedPosition)
          : positions.some((pos) => pos.code === op.position) &&
            (op.expectedOccupant === undefined || occupant === op.expectedOccupant) &&
            (op.wasField === undefined || Boolean(current) === op.wasField) &&
            (op.position !== "GK" || !occupant || occupant === op.player) &&
            !(draft.kind === "halftime" && keeperNeedsChoice() &&
              op.player !== draft.base.assignments.GK) &&
            (!entering || draft.kind !== "halftime" || (chosenEntrants().length < groupSize() &&
              (!occupant || dueOut().includes(occupant))))) &&
          (draft.kind !== "starting" || op.player !== draft.keeper);
        if (!valid) {
          cleared++;
          continue;
        }
        applyOperation(lineup, op);
        draft.operations.push(op);
      }
      if (skipped) {
        draft.skipped = new Set([...skipped].filter((player) =>
          draft.operations.some((op) => op.type === "bench" && op.player === player)));
      }
      state.selected = null;
      render();
      if (cleared) notify(`${cleared} dependent choice${cleared === 1 ? "" : "s"} also cleared.`);
    }
    function applyOperation(lineup, op) {
      const current = posFor(lineup.assignments, op.player);
      if (op.type === "bench") {
        if (!current) throw new Error(`${op.player} is not on the field`);
        lineup.assignments[current] = null;
        lineup.fieldQueue = lineup.fieldQueue.filter((player) => player !== op.player);
        lineup.benchQueue.push(op.player);
        return `${op.player} → Bench · ${displayFor(current)} opens`;
      }
      const occupant = lineup.assignments[op.position];
      if (current === op.position) return `${op.player} keeps ${displayFor(op.position)}`;
      if (op.position === "GK") {
        if (occupant && op.type !== "replacement") throw new Error("Goalkeeper position is occupied");
        if (current) {
          lineup.assignments[current] = null;
          lineup.fieldQueue = lineup.fieldQueue.filter((player) => player !== op.player);
        } else {

        render(); return;
      }
      if (element.dataset.exitReplacement) { replaceExit(element.dataset.exitReplacement); return; }
      if (element.dataset.subPlayer) {
        if (state.draft?.kind !== "planned") return;
        const name = element.dataset.subPlayer, lineup = preview();
        if (!state.draft.base.benchQueue.includes(name) || state.notReady.has(name) ||
            (!lineup.fieldQueue.includes(name) &&
              (!lineup.benchQueue.includes(name) || chosenEntrants().length >= groupSize()))) return;
        const selectedAgain = selectedPlayer(lineup) === name;
        state.selected = selectedAgain ? null : name;
        state.draft.selectionPaused = selectedAgain;
        render(); return;
      }
      if (element.dataset.keeper) {
        if (state.draft?.kind !== "halftime" ||
            ![...state.draft.base.fieldQueue, ...state.draft.base.benchQueue].includes(element.dataset.keeper)) return;
        state.draft.keeper = element.dataset.keeper;
        state.draft.restOutgoingKeeper = false;
        state.selected = null; render(); return;
      }
      if (element.dataset.select) {
        const player = element.dataset.select;
        if (!state.draft) {
          if (state.fieldQueue.includes(player) || state.benchQueue.includes(player)) {
            beginDraft("lineup");
            state.selected = player; render();
          }
          return;
        }
        if (state.draft.kind === "lineup") {
          const base = state.draft.base;
          const field = base.fieldQueue.includes(player) || base.assignments.GK === player;
          if (!field && !base.benchQueue.includes(player)) return;
          const current = state.selected && posFor(base.assignments, state.selected);
          if (!field && current) {
            setLineupChoice({ type: "replacement", player, position: current });
          } else if (!field && state.draft.targetPosition) {
            setLineupChoice({ player, position: state.draft.targetPosition });
          } else {
            state.draft.operations = [];
            state.selected = state.selected === player ? null : player;
            state.draft.targetPosition = null;
            render();
          }
          return;
        }
        const lineup = preview();
        const field = lineup.fieldQueue.includes(player) || lineup.assignments.GK === player;
        if (state.draft.kind === "starting") {
          if (!field && (player !== nextStarter(lineup) || !lineup.benchQueue.includes(player))) return;
          state.selected = player; render(); return;
        }
        if (keeperNeedsChoice() && player !== state.draft.base.assignments.GK) return;
        if (state.draft.kind === "halftime" && !state.draft.keeper) return;
        if (!field && (!eligibleBench().includes(player) || !lineup.benchQueue.includes(player))) return;
        if (!field && state.draft.kind !== "lineup" &&
            (["planned", "halftime"].includes(state.draft.kind)
              ? chosenEntrants().length >= groupSize() : player !== nextBench(lineup))) return;
        if (!field && state.draft.kind === "lineup" && state.selected &&
            posFor(lineup.assignments, state.selected)) {
          state.draft.operations.push({
            type: "replacement", player,
            position: posFor(lineup.assignments, state.selected)
          });
          state.selected = null;
          render(); return;
        }
        state.selected = state.draft.kind === "lineup" && field && state.selected === player
          ? null : player;
        if (state.draft.kind === "planned") state.draft.selectionPaused = false;
        render(); return;
      }
      if (element.dataset.resume && state.draft?.kind === "starting") {
        state.draft.skipped.delete(element.dataset.resume); render(); return;
      }
      if (element.dataset.ready) {
        const player = element.dataset.ready;
        if (state.draft?.kind === "planned") {
          if (!state.draft.base.benchQueue.includes(player)) return;
          if (chosenEntrants().some((choice) => choice.player === player)) {
            notify("Remove this player's substitution before marking them waiting."); return;
          }
          if (!state.notReady.has(player)) {
            const impact = planReconciliation({ waitingPlayer: player }).canceled;
            if (impact.length) {
              state.draft.pendingWait = { player, canceled: impact };
              render(); return;
            }
          }
          state.notReady.has(player) ? state.notReady.delete(player) : state.notReady.add(player);
          reconcilePlanned();
          render(); return;
        }
        if (state.draft?.kind !== "starting" &&
            chosenEntrants().length) {
          notify("Undo pending bench choices before changing readiness."); return;
        }
        state.notReady.has(player) ? state.notReady.delete(player) : state.notReady.add(player);
        state.selected = null; render();
        return;
      }
      if (element.dataset.attendance) {
        const player = element.dataset.attendance;
        const removing = state.arrivalOrder.includes(player);
        if (state.gameStarted) rememberChange();
        if (removing) {
          state.arrivalOrder = state.arrivalOrder.filter((name) => name !== player);
          const assigned = posFor(state.assignments, player);
          if (assigned) state.assignments[assigned] = null;
          state.fieldQueue = state.fieldQueue.filter((name) => name !== player);
          state.benchQueue = state.benchQueue.filter((name) => name !== player);
          state.notReady.delete(player);
        } else {
          state.arrivalOrder.push(player);
          state.benchQueue.push(player);
        }
        if (state.gameStarted) {
          state.events.unshift(`${player} ${removing ? "left; position opened" : "arrived; added to bench"}`);
        }
        syncDraftRoster(removing ? player : null);
        render(); return;
      }
      if (element.dataset.move) {
        if (state.gameStarted || (state.draft && state.draft.kind !== "starting")) return;
        const name = element.dataset.move, index = state.arrivalOrder.indexOf(name);
        const previous = state.arrivalOrder.slice(0, index).reverse().find((player) =>
          player !== state.draft?.keeper);
        if (previous) {
          const otherIndex = state.arrivalOrder.indexOf(previous);
          [state.arrivalOrder[index], state.arrivalOrder[otherIndex]] =
            [state.arrivalOrder[otherIndex], state.arrivalOrder[index]];
          state.benchQueue = state.arrivalOrder.filter((player) =>
            state.benchQueue.includes(player));
          syncStartingDraft();
          render();
        }
        return;
      }
      const action = element.dataset.action;
      if (pages[action]) { go(action); return; }
      if (action === "new-game") { newGame(); return; }
      if (action === "start-lineup") { startLineup(); return; }
      if (action === "lineup-reset" && state.draft?.kind === "lineup") {
        state.selected = null; state.draft.targetPosition = null;
        state.draft.operations = []; render(); return;
      }
      if (action === "rest-keeper" && keeperNeedsChoice()) {
        state.draft.restOutgoingKeeper = true; state.selected = null; render(); return;
      }
      if (action === "remove-keeper-choice" && state.draft?.keeper &&
          ["starting", "halftime"].includes(state.draft.kind)) {
        const draft = state.draft;
        draft.keeper = null;
        if (draft.kind === "starting") {
          removePendingChoice(-1);
        } else {
          const cleared = draft.operations.length + Number(draft.restOutgoingKeeper);
          draft.restOutgoingKeeper = false;
          draft.operations = [];
          state.selected = null;
          render();
          if (cleared) notify(`${cleared} dependent choice${cleared === 1 ? "" : "s"} also cleared.`);
        }
        return;
      }
      if (action === "cancel-keeper-rest" && state.draft?.kind === "halftime" &&
          state.draft.restOutgoingKeeper) {
        const cleared = state.draft.operations.length;
        state.draft.restOutgoingKeeper = false;
        state.draft.operations = [];
        state.selected = null;
        render();
        if (cleared) notify(`${cleared} dependent choice${cleared === 1 ? "" : "s"} also cleared.`);
        return;
      }
      if (action === "move-to-bench") { moveToBench(); return; }
      if (["planned", "halftime"].includes(action)) { beginDraft(action); return; }
      if (action === "confirm") { confirmDraft(); return; }
      if (element.dataset.removePending !== undefined &&
          ["starting", "halftime"].includes(state.draft?.kind)) {
        const index = Number(element.dataset.removePending);
        if (!Number.isInteger(index) || index < 0 || index >= state.draft.operations.length) return;
        removePendingChoice(index); return;
      }
      if (action === "discard" && state.draft) {
        if (state.draft.kind === "starting") { state.draft = null; state.selected = null; go("setup"); }
        else { state.draft = null; state.selected = null; go("game"); }
        return;
      }
      if (action === "undo-confirmed" && state.undoStack.length && !state.draft) {
        const previous = state.undoStack.pop();
        Object.assign(state, previous.lineup);
        state.players = previous.players;
        state.arrivalOrder = previous.arrivalOrder;
        state.notReady = previous.notReady;
        state.round = previous.round; state.half = previous.half;
        state.gameStarted = previous.gameStarted; state.events = previous.events;
        if (!state.gameStarted) go("setup");
        else { render(); notify("Last confirmed change undone"); }
        return;
      }
      if (action === "finish" && state.gameStarted && !state.draft) {
        if (!window.confirm("Finish this game and save it to this device?")) return;
        archiveGame();
        resetGame();
        go("home");
        notify("Game saved on this device");
      }
    });
    document.addEventListener("change", (event) => {
      if (event.target.id === "starting-keeper" && state.draft?.kind === "starting") {
        const name = event.target.value;
        if (name && !state.arrivalOrder.includes(name)) {
          notify("Check in this player before choosing them as goalkeeper."); return;
        }
        state.draft.keeper = name || null;
        syncStartingDraft();
        removePendingChoice(-1);
      }
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && state.draft?.pendingWait) {
        state.draft.pendingWait = null;
        render();
      }
    });
    document.addEventListener("submit", (event) => {
      if (event.target.id !== "add-player") return;
      event.preventDefault();
      const field = event.target.elements.player, name = field.value.trim();
      if (!name || state.players.some((player) => player.toLowerCase() === name.toLowerCase())) {
        notify("Enter a new player name."); return;
      }
      if (state.gameStarted) rememberChange();
      state.players.push(name);
      state.arrivalOrder.push(name);
      state.benchQueue.push(name);
      if (state.gameStarted) state.events.unshift(`${name} arrived; added to bench`);
      syncDraftRoster(null);
      field.value = ""; render(); notify(`${name} added to this game`);
    });
    document.getElementById("unlock-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const password = $("password").value;
      $("unlock-status").textContent = "";
      unlockTeam(password);
    });
    boot();
  </script>
</body>
</html>
